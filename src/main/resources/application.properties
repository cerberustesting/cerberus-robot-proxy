# and open the template in the editor.
server.port=8093

proxy.defaulttimeout=3600000
proxy.defaultenablecapture=true
proxy.defaultlocalproxyactive=false

# =========================================================================
# Authentication of all the services: none (default) | token | oauth. See README.
# =========================================================================
robotproxy.auth.mode=none

# =========================================================================
# None Mode.
# =========================================================================
# the relay (POST /relay) is disabled (503) unless relay.token is set, and then requires
# "Authorization: Bearer <relay.token>"; the other services stay open.
# Never commit a real secret here: pass it at startup (--relay.token=... or the RELAY_TOKEN environment variable).
#relay.token=

# =========================================================================
# Token Mode.
# =========================================================================
# token mode: shared secret, Authorization: Bearer <token> (defaults to relay.token)
#robotproxy.auth.token=

# =========================================================================
# OAuth Mode.
# =========================================================================
# oauth mode (Keycloak): any valid Bearer JWT (client_credentials) or logged-in user gets access to everything
#spring.security.oauth2.resourceserver.jwt.issuer-uri=https://keycloak.example.com/realms/cerberus
#spring.security.oauth2.resourceserver.jwt.audiences=cerberus-robot-proxy
# oauth mode: browser login of the UI (authorization code). Empty client-id = no browser login. Empty secret = public client (PKCE)
#robotproxy.auth.oauth2.ui.client-id=cerberus-robot-proxy
#robotproxy.auth.oauth2.ui.client-secret=

# Directory mounted and shared between the mitmproxy container and this app,
# used to stream real-time JSONL traffic logs to the front-end over WebSocket.
# Leave empty to disable real-time traffic streaming.
mitmproxy.traffic-log-dir=
scheduledtask.killproxy=0 * * ? * *

# Surfaces mitmdump's own stdout/stderr (TLS handshake failures, connection resets, addon
# errors, ...), forwarded line-by-line via MyMITMProxyService's log drain thread.
logging.level.org.cerberus.robot.proxy.proxy=INFO

#selenium.host=cerberus-executor-selenium
selenium.host=localhost
selenium.port=8092

# =========================================================================
# Post Start Scripts Configuration
# =========================================================================
# executable and arguments support ${executionUuid} as a placeholder, replaced at execution time
# with the executionUuid passed to /startProxy.
# Script 0: Example : ADB Clear
poststart.scripts[0].enabled=false
poststart.scripts[0].executable=adb
poststart.scripts[0].arguments=shell,pm,clear,app.package.name
poststart.scripts[0].waitFor=true
poststart.scripts[0].name=ADB_CLEAR
# Script 1: Example : Frida
poststart.scripts[1].enabled=false
poststart.scripts[1].executable=frida
poststart.scripts[1].arguments=-U,-f,app.package.name,-l,frida.script.path
poststart.scripts[1].waitFor=false
poststart.scripts[1].name=FRIDA
# Script 2: Send Video URL (script located next to the jar)
poststart.scripts[2].enabled=false
poststart.scripts[2].executable=./sendVideoURL.sh
poststart.scripts[2].arguments=${executionUuid},9109
poststart.scripts[2].waitFor=false
poststart.scripts[2].name=SEND_VIDEO_URL
# Script 2: Send Video URL (script located next to the jar)
poststart.scripts[3].enabled=false
poststart.scripts[3].executable=./sendVideoURLLocalhost.sh
poststart.scripts[3].arguments=${executionUuid},9109
poststart.scripts[3].waitFor=false
poststart.scripts[3].name=SEND_VIDEO_URL_LOCALHOST